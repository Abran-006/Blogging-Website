name: wf-ci-develop

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize

jobs:
  linting-develop-job:
    name: Lint HTML and CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Lint HTML Files With HTMLHint
        run: npx htmlhint "**/*.html"

      - name: Lint CSS Files With Stylelint
        run: npx stylelint "**/*.css"

  build-develop-job:
    name: Build job develop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository On the Runner
        uses: actions/checkout@v4
      - name: Build Static Wesbite With Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
      - name:  Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "build-artifact-develop"
